<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Chat Test (HTTPS)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #333; }
        .box { padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #fafafa; }
        input[type="text"], input[type="number"] { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        ul { list-style-type: none; padding: 0; max-height: 300px; overflow-y: auto; border: 1px solid #eee; background: white; }
        li { padding: 8px 10px; border-bottom: 1px solid #f1f1f1; }
        .status { font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>💬 채팅 테스트 (HTTPS)</h2>

    <div class="box" style="background-color: #e8f4ff; border-color: #b6d4fe;">
        <strong>ℹ️ 체크리스트:</strong><br>
        1) 로그인 API 호출 완료(쿠키 생성)<br>
        2) 이 파일을 <strong>src/main/resources/static</strong>에 넣고 서버 실행/배포<br>
        3) 브라우저로 <strong>https://api.menual.site/chat-test.html</strong> 접속
    </div>

    <div class="box">
        <h4>1. 서버 연결</h4>
        <!-- 같은 도메인에서 열 거면 상대경로가 제일 안전 -->
        <input type="text" id="serverUrl" value="/ws/chat" style="width: 70%;">
        <button id="btnConnect" onclick="connect()">🔌 연결하기</button>
        <button id="btnDisconnect" onclick="disconnect()" disabled>❌ 종료</button>
        <span id="status" class="status" style="color: red;">(연결 끊김)</span>
    </div>

    <div class="box">
        <h4>2. 메시지 전송</h4>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="roomId" placeholder="방 번호" value="1" style="width: 80px;">
            <input type="text" id="senderId" placeholder="Sender ID" value="1" style="width: 100px;">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <input type="text" id="msgContent" placeholder="메시지 내용" style="width: 100%;">
            <button id="btnSend" onclick="sendMessage()" disabled>🚀 전송</button>
        </div>
    </div>

    <div class="box">
        <h4>3. 수신된 메시지</h4>
        <ul id="messages"></ul>
    </div>
</div>

<script>
    let stompClient = null;

    function setConnected(connected) {
        document.getElementById('btnConnect').disabled = connected;
        document.getElementById('btnDisconnect').disabled = !connected;
        document.getElementById('btnSend').disabled = !connected;

        const statusSpan = document.getElementById("status");
        if (connected) {
            statusSpan.innerText = "✅ 연결됨";
            statusSpan.style.color = "green";
        } else {
            statusSpan.innerText = "🔴 연결 끊김";
            statusSpan.style.color = "red";
        }
    }

    function resolveSockJsUrl(input) {
        // "/ws/chat" 같은 상대경로면 현재 오리진 붙여줌 (https://api.menual.site)
        if (input.startsWith("/")) return window.location.origin + input;
        return input;
    }

    function connect() {
        const raw = document.getElementById("serverUrl").value.trim();
        const url = resolveSockJsUrl(raw);

        const socket = new SockJS(url);
        stompClient = Stomp.over(socket);

        // 쿠키 인증이면 헤더 비워도 됨 (같은 도메인에서 열면 쿠키 자동 포함)
        stompClient.connect({}, function (frame) {
            setConnected(true);
            console.log('Connected: ' + frame);

            const roomId = document.getElementById("roomId").value;

            stompClient.subscribe('/sub/chatrooms/' + roomId, function (message) {
                const body = JSON.parse(message.body);
                showOutput(body.payload ? body.payload : body);
            });

            alert("연결 성공! 방 번호 " + roomId + "번 구독 중");
        }, function (error) {
            console.log("Connection Error:", error);
            alert("연결 실패 (로그인/쿠키/엔드포인트 확인)\n" + error);
            setConnected(false);
        });
    }

    function disconnect() {
        if (stompClient) stompClient.disconnect();
        setConnected(false);
    }

    function sendMessage() {
        const roomId = document.getElementById("roomId").value;
        const senderId = document.getElementById("senderId").value;
        const content = document.getElementById("msgContent").value;

        if (!content) return;

        const chatMessage = {
            chatroomId: roomId,
            senderId: senderId,
            messageType: 'TEXT',
            content: content
        };

        // 서버가 "/pub/chat.message"라면 여기만 바꿔야 함
        stompClient.send("/pub/chat/message", {}, JSON.stringify(chatMessage));
        document.getElementById("msgContent").value = '';
    }

    function showOutput(data) {
        const ul = document.getElementById("messages");
        const li = document.createElement("li");
        const time = new Date().toLocaleTimeString();

        const content = data.content || "내용 없음";
        const sender = data.senderId || "Unknown";
        const type = data.messageType || "TEXT";

        li.innerHTML = `[${time}] <strong>User ${sender}</strong> (${type}): ${content}`;
        ul.prepend(li);
    }
</script>
</body>
</html>
