version: "3.8"

services:
  app:
    image: ${DOCKERHUB_USERNAME:-danaggero}/menual-spring:latest
    container_name: menual-spring
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - menual-net

  redis:
    image: redis:7-alpine
    container_name: menual-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - menual-net

  nginx:
    image: nginx:latest
    container_name: menual-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - menual-net

volumes:
  redis-data:

networks:
  menual-net:
    driver: bridge